
name: Kafka-Malicious-Text
services:
  kafka:
    image: bitnami/kafka:3.7
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"  # Expose Kafka externally for development
    environment:
      # KRaft mode configuration
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Auto-create topics and replication settings
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_NUM_PARTITIONS: 3
      # Allow external connections
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - kafka_internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "9080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - kafka_internal
      - frontend

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"  # Expose MongoDB for external access if needed
    environment:
      MONGO_INITDB_DATABASE: tweets
    volumes:
      - mongodb_data:/data/db
    networks:
      - kafka_internal
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok ? 0 : 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - kafka_internal
      - frontend

  data-retrieval:
    build:
      context: ./data_retrieval
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB_NAME: tweets
      MONGO_COLLECTION_ANTISEMITIC: tweets_antisemitic
      MONGO_COLLECTION_NOT_ANTISEMITIC: tweets_not_antisemitic
      LOG_LEVEL: INFO
      LOG_MONGO: ERROR
    depends_on:
      mongodb: { condition: service_healthy }
    networks:
      - kafka_internal
      - frontend
    ports:
      - "8000:8000"

  retriever:
    build:
      context: ./retriever
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_ATLAS_URI: "mongodb+srv://IRGC_NEW:iran135@cluster0.6ycjkak.mongodb.net/"
      MONGO_DB_NAME: "IranMalDB"
      MONGO_COLLECTION_RAW_TWEETS: "tweets"
      MONGO_CLASSIFICATION_FIELD: "Antisemitic"
      KAFKA_URL: "kafka"
      KAFKA_PORT: "9092"
      KAFKA_TOPIC_OUT_ANTISEMITIC: "raw_tweets_antisemitic"
      KAFKA_TOPIC_OUT_NOT_ANTISEMITIC: "raw_tweets_not_antisemitic"
      KAFKA_GROUP_ID: "retrieve-group"
      LOG_LEVEL: "INFO"
      LOG_KAFKA: "ERROR"
      LOG_MONGO: "ERROR"
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - kafka_internal  # Needs internal network for Kafka
      - egress          # Needs egress for MongoDB Atlas

  preprocessor:
    build:
      context: .
      dockerfile: preprocessor/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_URL: "kafka"
      KAFKA_PORT: "9092"
      KAFKA_TOPIC_IN_ANTISEMITIC: "raw_tweets_antisemitic"
      KAFKA_TOPIC_IN_NOT_ANTISEMITIC: "raw_tweets_not_antisemitic"
      KAFKA_TOPIC_OUT_ANTISEMITIC: "preprocessed_tweets_antisemitic"
      KAFKA_TOPIC_OUT_NOT_ANTISEMITIC: "preprocessed_tweets_not_antisemitic"
      TARGET_KEY: "text"
      KAFKA_GROUP_ID: "preprocessor-group"
      LOG_LEVEL: "INFO"
      LOG_KAFKA: "ERROR"
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - kafka_internal
      - egress

  enricher:
    build:
      context: .
      dockerfile: enricher/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_URL: "kafka"
      KAFKA_PORT: "9092"
      KAFKA_TOPIC_IN_ANTISEMITIC: "preprocessed_tweets_antisemitic"
      KAFKA_TOPIC_IN_NOT_ANTISEMITIC: "preprocessed_tweets_not_antisemitic"
      KAFKA_TOPIC_OUT_ANTISEMITIC: "enriched_preprocessed_tweets_antisemitic"
      KAFKA_TOPIC_OUT_NOT_ANTISEMITIC: "enriched_preprocessed_tweets_not_antisemitic"
      ORIGINAL_TEXT_FIELD: "text"
      TARGET_PROCESSED: "clean_text"
      KAFKA_GROUP_ID: "enricher-group"
      WEAPONS_FILE_PATH: "data/weapon_list.txt"
      SENTIMENT_THRESHOLD_NEGATIVE: "-0.5"
      SENTIMENT_THRESHOLD_POSITIVE: "0.5"
      LOG_LEVEL: "INFO"
      LOG_KAFKA: "ERROR"
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - kafka_internal
      - egress

  persister:
    build:
      context: ./persister
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_URL: "kafka"
      KAFKA_PORT: "9092"
      MONGO_HOST: "mongodb"
      MONGO_PORT: "27017"
      MONGO_DB_NAME: "tweets"
      MONGO_COLLECTION_ANTISEMITIC: "tweets_antisemitic"
      MONGO_COLLECTION_NOT_ANTISEMITIC: "tweets_not_antisemitic"
      KAFKA_TOPIC_IN_ANTISEMITIC: "enriched_preprocessed_tweets_antisemitic"
      KAFKA_TOPIC_IN_NOT_ANTISEMITIC: "enriched_preprocessed_tweets_not_antisemitic"
      KAFKA_GROUP_ID: "persister-group"
      LOG_LEVEL: "INFO"
      LOG_KAFKA: "ERROR"
      LOG_MONGO: "ERROR"
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    networks:
      - kafka_internal

networks:
  kafka_internal:
    driver: bridge  # Remove internal: true to allow connectivity
  egress: {}
  frontend: {}

volumes:
  kafka_data:
  mongodb_data:
